<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sensor Lab">
<meta name="theme-color" content="#06060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Sensor Lab v1</title>
<style>
  :root { --bg:#06060c; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09); --txt:#e8ecf4; --mut:#8b93a7;
          --c1:#22d3ee; --c2:#f472b6; --c3:#a3e635; --c4:#fbbf24; --c5:#a78bfa; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
               font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
               -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; overflow-x: hidden; user-select: none; -webkit-user-select: none;
         padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px)
                  calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px); }
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
  .bg i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .28; }
  .bg i:nth-child(1) { background: var(--c1); left: -30vmax; top: -30vmax; animation: d1 22s ease-in-out infinite alternate; }
  .bg i:nth-child(2) { background: var(--c2); right: -35vmax; top: 20vh; animation: d2 26s ease-in-out infinite alternate; }
  .bg i:nth-child(3) { background: var(--c5); left: -10vmax; bottom: -45vmax; animation: d3 30s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(25vmax, 30vh) scale(1.2); } }
  @keyframes d2 { to { transform: translate(-20vmax, 35vh) scale(.8); } }
  @keyframes d3 { to { transform: translate(30vmax, -30vh) scale(1.1); } }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin: 6px 2px 14px;
       background: linear-gradient(90deg, var(--c1), var(--c5), var(--c2)); -webkit-background-clip: text;
       background-clip: text; color: transparent; }
  main { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 14px; min-width: 0;
          backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
          box-shadow: 0 10px 40px rgba(0,0,0,.35); animation: rise .7s both; }
  .card:nth-child(2) { animation-delay: .05s; } .card:nth-child(3) { animation-delay: .1s; }
  .card:nth-child(4) { animation-delay: .15s; } .card:nth-child(5) { animation-delay: .2s; }
  .card:nth-child(n+6) { animation-delay: .25s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
  .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 32px; }
  .hd h2 { font-size: 17px; margin: 0; font-weight: 700; white-space: nowrap; }
  .st { color: var(--mut); font-size: 12.5px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #4b5563; flex: none; }
  .card[data-state=live] .dot { background: var(--c3); box-shadow: 0 0 10px var(--c3); animation: pulse 1.6s infinite; }
  .card[data-state=wait] .dot { background: var(--c4); box-shadow: 0 0 10px var(--c4); }
  .card[data-state=err] .dot { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  @keyframes pulse { 50% { opacity: .35; } }
  button { appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px; padding: 7px 15px; flex: none;
           font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #06060c; cursor: pointer;
           background: linear-gradient(135deg, var(--c1), var(--c5)); box-shadow: 0 4px 16px rgba(34,211,238,.25); }
  button.stop, button.ghost { background: rgba(255,255,255,.1); color: var(--txt); box-shadow: none; }
  button:disabled { opacity: .35; }
  button[hidden] { display: none; }
  canvas { display: block; width: 100%; }
  .graph { height: 92px; border-radius: 12px; background: rgba(0,0,0,.28); }
  .lbl { font-size: 11px; color: var(--mut); margin: 12px 2px 5px; text-transform: uppercase; letter-spacing: .08em; }
  .vals { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; margin-top: 10px; }
  .v { background: rgba(255,255,255,.045); border-radius: 10px; padding: 6px 8px; min-width: 0; }
  .k { display: block; font-size: 10.5px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
  .n { display: block; font: 600 14px ui-monospace, "SF Mono", Menlo, Consolas, monospace;
       white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage { height: 210px; perspective: 650px; display: grid; place-items: center; overflow: hidden;
           border-radius: 14px; background: radial-gradient(ellipse at 50% 60%, rgba(167,139,250,.18), transparent 65%); }
  .world { transform-style: preserve-3d; transform: rotateX(55deg); }
  .phone { width: 74px; height: 150px; position: relative; transform-style: preserve-3d; }
  .phone > div { position: absolute; }
  .phone .front, .phone .back { inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .phone .front { transform: translateZ(5px); background: #0b1020; border: 3px solid #94a3b8; }
  .phone .front::before { content: ""; position: absolute; inset: 3px; border-radius: 9px;
                          background: linear-gradient(160deg, var(--c1), var(--c5) 55%, var(--c2)); opacity: .85; }
  .phone .front::after { content: ""; position: absolute; top: 7px; left: 50%; width: 22px; height: 6px; margin-left: -11px;
                         border-radius: 4px; background: #0b1020; }
  .phone .back { transform: rotateY(180deg) translateZ(5px); background: linear-gradient(160deg, #334155, #0f172a);
                 border: 3px solid #94a3b8; }
  .phone .back::after { content: ""; position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 7px;
                        background: #1e293b; box-shadow: inset 0 0 0 2px #475569; }
  .phone .l, .phone .r { top: 6px; bottom: 6px; width: 10px; background: #64748b; }
  .phone .l { left: -5px; transform: rotateY(-90deg); }
  .phone .r { right: -5px; transform: rotateY(90deg); }
  .phone .t, .phone .b { left: 6px; right: 6px; height: 10px; background: #475569; }
  .phone .t { top: -5px; transform: rotateX(90deg); }
  .phone .b { bottom: -5px; transform: rotateX(-90deg); }
  .sq { height: 230px; }
  #micCanvas { height: 180px; border-radius: 12px; background: rgba(0,0,0,.28); }
  #geoCanvas { height: 230px; border-radius: 12px; background: rgba(0,0,0,.28); }
  .camwrap { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; background: #000; }
  .camwrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camwrap video.mirror { transform: scaleX(-1); }
  .camwrap canvas { position: absolute; inset: 0; height: 100%; }
  #swatch { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,.8); background: #000; box-shadow: 0 0 18px rgba(0,0,0,.5); }
  .btns { display: flex; gap: 8px; }
  #pad { height: 280px; border-radius: 14px; background: rgba(0,0,0,.28); touch-action: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 11px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line); color: #6b7280; }
  .chip.ok { color: var(--c3); border-color: rgba(163,230,53,.35); background: rgba(163,230,53,.07); }
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<h1>Sensor Lab</h1>
<main>

  <section class="card" id="c-motion">
    <div class="hd"><span class="dot"></span><h2>Motion</h2><span class="st">Idle</span><button data-start="motion">Start</button></div>
    <div class="stage"><div class="world"><div class="phone" id="phone">
      <div class="front"></div><div class="back"></div><div class="l"></div><div class="r"></div><div class="t"></div><div class="b"></div>
    </div></div></div>
    <div class="lbl">Acceleration · m/s²</div>
    <canvas id="accGraph" class="graph"></canvas>
    <div class="vals" id="accVals"></div>
    <div class="lbl">Gyroscope · °/s</div>
    <canvas id="gyroGraph" class="graph"></canvas>
    <div class="vals" id="gyroVals"></div>
  </section>

  <section class="card" id="c-level">
    <div class="hd"><span class="dot"></span><h2>Orientation</h2><span class="st">Idle</span><button data-start="motion">Start</button></div>
    <canvas id="levelCanvas" class="sq"></canvas>
    <div class="vals" id="levelVals"></div>
  </section>

  <section class="card" id="c-compass">
    <div class="hd"><span class="dot"></span><h2>Compass</h2><span class="st">Idle</span><button data-start="motion">Start</button></div>
    <canvas id="compassCanvas" class="sq"></canvas>
    <div class="vals" id="compassVals"></div>
  </section>

  <section class="card" id="c-touch">
    <div class="hd"><span class="dot"></span><h2>Multi-touch</h2><span class="st">Ready</span></div>
    <canvas id="pad"></canvas>
    <div class="vals" id="touchVals"></div>
  </section>

  <section class="card" id="c-mic">
    <div class="hd"><span class="dot"></span><h2>Microphone</h2><span class="st">Idle</span><button data-start="mic">Start</button></div>
    <canvas id="micCanvas"></canvas>
    <div class="vals" id="micVals"></div>
  </section>

  <section class="card" id="c-cam">
    <div class="hd"><span class="dot"></span><h2>Camera</h2><span class="st">Idle</span>
      <div class="btns"><button class="ghost" id="flip" disabled>Flip</button><button data-start="cam">Start</button></div></div>
    <div class="camwrap"><video id="video" playsinline muted autoplay></video><canvas id="camCanvas"></canvas><div id="swatch"></div></div>
    <div class="vals" id="camVals"></div>
  </section>

  <section class="card" id="c-geo">
    <div class="hd"><span class="dot"></span><h2>Location</h2><span class="st">Idle</span><button data-start="geo">Start</button></div>
    <canvas id="geoCanvas"></canvas>
    <div class="vals" id="geoVals"></div>
  </section>

  <section class="card" id="c-disp">
    <div class="hd"><span class="dot"></span><h2>Display &amp; device</h2><span class="st">Live</span></div>
    <div class="vals" id="dispVals"></div>
  </section>

  <section class="card" id="c-api">
    <div class="hd"><span class="dot"></span><h2>Web APIs</h2><span class="st"></span></div>
    <div class="chips" id="apiChips"></div>
  </section>

</main>
<script>
'use strict';

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 2) => (v == null || isNaN(v)) ? '–' : v.toFixed(d);
const TAU = Math.PI * 2;

function fit(c) {
  const r = Math.min(window.devicePixelRatio || 1, 3);
  const w = c.clientWidth, h = c.clientHeight;
  const W = Math.round(w * r), H = Math.round(h * r);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const ctx = c.getContext('2d');
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function status(card, state, text) {
  const c = $(card);
  c.dataset.state = state;
  const s = c.querySelector('.st');
  if (s.textContent !== text) s.textContent = text;
}

function vals(id, keys) {
  const el = $(id), o = {};
  for (const k of keys) {
    const d = document.createElement('div'); d.className = 'v';
    const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
    const b = document.createElement('span'); b.className = 'n'; b.textContent = '–';
    d.append(a, b); el.append(d); o[k] = b;
  }
  return o;
}
function put(o, k, t) { if (o[k].textContent !== t) o[k].textContent = t; }

function setBtn(kind, live) {
  document.querySelectorAll(`[data-start="${kind}"]`).forEach(b => {
    b.textContent = live ? 'Stop' : 'Start';
    b.classList.toggle('stop', live);
  });
}

// Which cards are on screen; off-screen cards are not redrawn.
const visible = new Set();
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id)));
document.querySelectorAll('.card').forEach(c => io.observe(c));

// ---------- scrolling line graph ----------
class Graph {
  constructor(canvas, colors, range, unit) {
    this.c = canvas; this.colors = colors; this.range = range; this.unit = unit;
    this.n = 160; this.i = 0; this.scale = range;
    this.data = colors.map(() => new Float32Array(this.n));
  }
  push(v) { for (let k = 0; k < this.data.length; k++) this.data[k][this.i] = v[k] || 0; this.i = (this.i + 1) % this.n; }
  draw() {
    const { ctx, w, h } = fit(this.c), n = this.n;
    let m = this.range;
    for (const d of this.data) for (let j = 0; j < n; j++) m = Math.max(m, Math.abs(d[j]));
    this.scale += (m - this.scale) * 0.1;
    const s = this.scale;
    ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
    for (let q = 1; q < 4; q++) { ctx.beginPath(); ctx.moveTo(0, h * q / 4); ctx.lineTo(w, h * q / 4); ctx.stroke(); }
    ctx.lineWidth = 2; ctx.lineJoin = 'round';
    this.data.forEach((d, k) => {
      ctx.strokeStyle = ctx.shadowColor = this.colors[k]; ctx.shadowBlur = 8;
      ctx.beginPath();
      for (let j = 0; j < n; j++) {
        const x = j / (n - 1) * w, y = h / 2 - d[(this.i + j) % n] / s * (h / 2 - 4);
        j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    });
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '10px ui-monospace, Menlo, monospace';
    ctx.fillText('±' + s.toFixed(s < 10 ? 1 : 0) + ' ' + this.unit, 6, 13);
  }
}

// ---------- motion & orientation ----------
const M = { acc: [0, 0, 0], accG: [null, null, null], rot: [0, 0, 0], linear: false, got: false, n: 0, hz: 0 };
const O = { a: null, b: null, g: null, heading: null, hacc: null, src: '–', got: false, n: 0, hz: 0 };
const accGraph = new Graph($('accGraph'), ['#22d3ee', '#f472b6', '#a3e635'], 2, 'm/s²');
const gyroGraph = new Graph($('gyroGraph'), ['#fbbf24', '#a78bfa', '#22d3ee'], 60, '°/s');
const accV = vals('accVals', ['X', 'Y', 'Z', '|a|', 'Grav X', 'Grav Y', 'Grav Z', 'Rate']);
const gyroV = vals('gyroVals', ['α', 'β', 'γ', '|ω|']);
const levelV = vals('levelVals', ['α', 'β', 'γ', 'Tilt', 'Rate']);
const compV = vals('compassVals', ['Heading', 'Direction', 'Accuracy', 'Source']);
let motionOn = false;

function onMotion(e) {
  const a = e.acceleration, g = e.accelerationIncludingGravity, r = e.rotationRate;
  if (a && a.x != null) { M.acc = [a.x, a.y, a.z]; M.linear = true; }
  if (g && g.x != null) { M.accG = [g.x, g.y, g.z]; if (!M.linear) M.acc = M.accG; }
  if (r && r.alpha != null) M.rot = [r.alpha, r.beta, r.gamma];
  if ((a && a.x != null) || (g && g.x != null) || (r && r.alpha != null)) {
    M.got = true; M.n++;
    accGraph.push(M.acc); gyroGraph.push(M.rot);
  }
}

function onOrient(e) {
  if (e.beta == null && e.alpha == null) return;
  O.a = e.alpha; O.b = e.beta; O.g = e.gamma; O.got = true; O.n++;
  if (e.webkitCompassHeading != null) {
    O.heading = e.webkitCompassHeading; O.hacc = e.webkitCompassAccuracy; O.src = 'Magnetometer';
  } else if (e.absolute && e.alpha != null) {
    O.heading = (360 - e.alpha) % 360; O.src = 'Absolute';
  }
}

function onOrientAbs(e) {
  if (e.alpha != null && O.src !== 'Magnetometer') { O.heading = (360 - e.alpha) % 360; O.src = 'Absolute'; }
}

const motionCards = ['c-motion', 'c-level', 'c-compass'];
function startMotion() {
  if (motionOn) return;
  const reqs = [];
  // iOS: both must be requested synchronously inside the tap.
  if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') reqs.push(DeviceMotionEvent.requestPermission());
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') reqs.push(DeviceOrientationEvent.requestPermission());
  Promise.all(reqs).then(res => {
    if (res.some(r => r !== 'granted')) { motionCards.forEach(c => status(c, 'err', 'Permission denied')); return; }
    motionOn = true;
    document.querySelectorAll('[data-start="motion"]').forEach(b => b.hidden = true);
    window.addEventListener('devicemotion', onMotion);
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('deviceorientationabsolute', onOrientAbs);
    motionCards.forEach(c => status(c, 'wait', 'Waiting for data…'));
    setTimeout(() => {
      if (!M.got) status('c-motion', 'err', 'No motion sensor');
      if (!O.got) status('c-level', 'err', 'No orientation sensor');
      if (O.heading == null) status('c-compass', 'err', 'No compass heading');
    }, 2000);
  }).catch(err => motionCards.forEach(c => status(c, 'err', err.message || 'Not allowed')));
}

function drawMotion(t, txt) {
  const ph = $('phone');
  ph.style.transform = O.got
    ? `rotateZ(${-(O.a || 0)}deg) rotateX(${-(O.b || 0)}deg) rotateY(${O.g || 0}deg)`
    : `rotateZ(${t * 0.03}deg) rotateX(-12deg)`;
  accGraph.draw(); gyroGraph.draw();
  if (!txt) return;
  const [x, y, z] = M.acc, [gx, gy, gz] = M.accG, [ra, rb, rg] = M.rot;
  put(accV, 'X', fmt(x)); put(accV, 'Y', fmt(y)); put(accV, 'Z', fmt(z));
  put(accV, '|a|', fmt(Math.hypot(x, y, z)));
  put(accV, 'Grav X', fmt(gx)); put(accV, 'Grav Y', fmt(gy)); put(accV, 'Grav Z', fmt(gz));
  put(accV, 'Rate', M.got ? M.hz + ' Hz' : '–');
  put(gyroV, 'α', fmt(ra, 1)); put(gyroV, 'β', fmt(rb, 1)); put(gyroV, 'γ', fmt(rg, 1));
  put(gyroV, '|ω|', fmt(Math.hypot(ra, rb, rg), 1));
}

const L = { x: 0, y: 0 };
function drawLevel(t, txt) {
  const { ctx, w, h } = fit($('levelCanvas'));
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 8;
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  bg.addColorStop(0, 'rgba(34,211,238,.10)'); bg.addColorStop(1, 'rgba(167,139,250,.04)');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;
  for (const f of [1, 2 / 3, 1 / 3]) { ctx.beginPath(); ctx.arc(cx, cy, R * f, 0, TAU); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
  const b = O.b || 0, g = O.g || 0;
  let vx = -g / 30, vy = -b / 30;
  if (!O.got) { vx = Math.cos(t / 900) * 0.35; vy = Math.sin(t / 700) * 0.35; }
  const len = Math.hypot(vx, vy);
  if (len > 1) { vx /= len; vy /= len; }
  L.x += (vx - L.x) * 0.25; L.y += (vy - L.y) * 0.25;
  const tilt = Math.hypot(b, g), flat = O.got && tilt < 1;
  const col = flat ? '163,230,53' : '34,211,238';
  const bx = cx + L.x * (R - 24), by = cy + L.y * (R - 24);
  const gr = ctx.createRadialGradient(bx - 6, by - 6, 2, bx, by, 26);
  gr.addColorStop(0, `rgba(255,255,255,.95)`); gr.addColorStop(.35, `rgba(${col},.9)`); gr.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(bx, by, 26, 0, TAU); ctx.fill();
  ctx.strokeStyle = `rgba(${col},.9)`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 24, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = '600 13px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center';
  ctx.fillText(O.got ? tilt.toFixed(1) + '°' : '', cx, cy + R - 14);
  ctx.textAlign = 'start';
  if (!txt) return;
  put(levelV, 'α', fmt(O.a, 1) + (O.got ? '°' : '')); put(levelV, 'β', fmt(O.b, 1) + (O.got ? '°' : ''));
  put(levelV, 'γ', fmt(O.g, 1) + (O.got ? '°' : '')); put(levelV, 'Tilt', O.got ? tilt.toFixed(1) + '°' : '–');
  put(levelV, 'Rate', O.got ? O.hz + ' Hz' : '–');
}

const C = { cur: 0 };
const DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
function drawCompass(t, txt) {
  const { ctx, w, h } = fit($('compassCanvas'));
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10;
  const target = O.heading != null ? O.heading : (t / 60) % 360;
  C.cur += (((target - C.cur + 540) % 360) - 180) * 0.15;
  C.cur = (C.cur + 360) % 360;
  const ring = ctx.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
  ring.addColorStop(0, 'rgba(167,139,250,0)'); ring.addColorStop(1, 'rgba(167,139,250,.18)');
  ctx.fillStyle = ring; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();

// ---------- multi-touch ----------
const pad = $('pad');
const T = { p: new Map(), max: 0, hue: 190, trail: [], ripples: [], last: null };
const touchV = vals('touchVals', ['Touches', 'Max', 'Pressure', 'Size', 'Type']);

function padXY(e) { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
pad.addEventListener('pointerdown', e => {
  e.preventDefault();
  pad.setPointerCapture(e.pointerId);
  const [x, y] = padXY(e);
  T.hue = (T.hue + 67) % 360;
  T.p.set(e.pointerId, { x, y, pr: e.pressure, w: e.width, h: e.height, hue: T.hue, type: e.pointerType });
  T.max = Math.max(T.max, T.p.size);
  T.last = T.p.get(e.pointerId);
  status('c-touch', 'live', T.p.size + ' active');
});
pad.addEventListener('pointermove', e => {
  const p = T.p.get(e.pointerId);
  if (!p) return;
  [p.x, p.y] = padXY(e);
  p.pr = e.pressure; p.w = e.width; p.h = e.height;
  T.last = p;
  T.trail.push({ x: p.x, y: p.y, hue: p.hue, t: performance.now() });
});
function padUp(e) {
  const p = T.p.get(e.pointerId);
  if (!p) return;
  T.ripples.push({ x: p.x, y: p.y, hue: p.hue, t: performance.now() });
  T.p.delete(e.pointerId);
  status('c-touch', T.p.size ? 'live' : 'idle', T.p.size ? T.p.size + ' active' : 'Ready');
}
pad.addEventListener('pointerup', padUp);
pad.addEventListener('pointercancel', padUp);

function drawTouch(t, txt) {
  const { ctx, w, h } = fit(pad);
  ctx.fillStyle = 'rgba(255,255,255,.09)';
  for (let x = 12; x < w; x += 24) for (let y = 12; y < h; y += 24) ctx.fillRect(x, y, 1.5, 1.5);
  T.trail = T.trail.filter(p => t - p.t < 700);
  for (const p of T.trail) {
    const a = 1 - (t - p.t) / 700;
    ctx.fillStyle = `hsla(${p.hue},95%,62%,${a * 0.35})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + 12 * a, 0, TAU); ctx.fill();
  }
  T.ripples = T.ripples.filter(r => t - r.t < 650);
  for (const r of T.ripples) {
    const k = (t - r.t) / 650;
    ctx.strokeStyle = `hsla(${r.hue},95%,65%,${1 - k})`; ctx.lineWidth = 3 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, 30 + 70 * k, 0, TAU); ctx.stroke();
  }
  const pts = [...T.p.values()];
  if (pts.length > 1) {
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.fillStyle = 'rgba(167,139,250,.08)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  pts.forEach((p, i) => {
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 60);
    g.addColorStop(0, `hsla(${p.hue},95%,65%,.55)`); g.addColorStop(1, `hsla(${p.hue},95%,65%,0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 60, 0, TAU); ctx.fill();
    ctx.strokeStyle = `hsl(${p.hue},95%,68%)`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 30 + 8 * Math.sin(t / 150 + i), 0, TAU); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 14px -apple-system, Segoe UI, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, p.x, p.y);
  });
  ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
  if (!txt) return;
  const p = T.last;
  put(touchV, 'Touches', String(T.p.size)); put(touchV, 'Max', String(T.max));
  put(touchV, 'Pressure', p ? fmt(p.pr) : '–');
  put(touchV, 'Size', p ? Math.round(p.w) + '×' + Math.round(p.h) : '–');
  put(touchV, 'Type', p ? p.type : '–');
}

// ---------- microphone ----------
const A = { ctx: null, an: null, stream: null, time: null, freq: null, db: -100, peak: -100, f: null };
const micV = vals('micVals', ['Level', 'Peak', 'Pitch', 'Note', 'Sample rate']);
const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

function noteName(f) {
  const m = 12 * Math.log2(f / 440) + 69, r = Math.round(m), c = Math.round((m - r) * 100);
  return NOTES[(r % 12 + 12) % 12] + (Math.floor(r / 12) - 1) + ' ' + (c >= 0 ? '+' : '') + c + '¢';
}

async function startMic() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status('c-mic', 'err', 'Not supported'); return; }
  const ctx = new AC();          // created inside the tap so iOS lets it run
  ctx.resume();
  status('c-mic', 'wait', 'Requesting…');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    await ctx.resume();
    const src = ctx.createMediaStreamSource(s), an = ctx.createAnalyser(), mute = ctx.createGain();
    an.fftSize = 4096; an.smoothingTimeConstant = 0.6; mute.gain.value = 0;
    src.connect(an); an.connect(mute); mute.connect(ctx.destination);
    Object.assign(A, { ctx, an, stream: s, time: new Float32Array(an.fftSize), freq: new Float32Array(an.frequencyBinCount), peak: -100 });
    status('c-mic', 'live', 'Listening');
    setBtn('mic', true);
  } catch (e) {
    ctx.close();
    status('c-mic', 'err', e.name === 'NotAllowedError' ? 'Permission denied' : (e.message || 'Error'));
  }
}

function stopMic() {
  A.stream.getTracks().forEach(t => t.stop());
  A.ctx.close();
  Object.assign(A, { ctx: null, an: null, stream: null, f: null, db: -100 });
  status('c-mic', 'idle', 'Stopped');
  setBtn('mic', false);
}

function drawMic(t, txt) {
  const { ctx, w, h } = fit($('micCanvas'));
  const sh = h - 22;
  if (!A.an) {
    ctx.strokeStyle = 'rgba(34,211,238,.5)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x <= w; x += 4) {
      const y = sh / 2 + Math.sin(x / 18 + t / 300) * 6 * Math.sin(x / w * Math.PI);
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    return;
  }
  const an = A.an, sr = A.ctx.sampleRate, bins = A.freq.length, hzPerBin = sr / an.fftSize;
  an.getFloatTimeDomainData(A.time);
  an.getFloatFrequencyData(A.freq);
  let sum = 0;
  for (let i = 0; i < A.time.length; i++) sum += A.time[i] * A.time[i];
  A.db = Math.max(-100, 20 * Math.log10(Math.sqrt(sum / A.time.length) + 1e-9));
  A.peak = Math.max(A.db, A.peak - 0.4);

  const N = 56, fMin = 50, fMax = Math.min(12000, sr / 2), bw = w / N;
  for (let i = 0; i < N; i++) {
    const f0 = fMin * Math.pow(fMax / fMin, i / N), f1 = fMin * Math.pow(fMax / fMin, (i + 1) / N);
    let m = -140;
    for (let b = Math.floor(f0 / hzPerBin); b <= Math.ceil(f1 / hzPerBin) && b < bins; b++) m = Math.max(m, A.freq[b]);
    const v = clamp((m + 100) / 80, 0, 1), bh = Math.max(2, v * sh);
    const g = ctx.createLinearGradient(0, sh, 0, sh - bh);
    g.addColorStop(0, `hsla(${190 + i * 2.4},90%,60%,.25)`); g.addColorStop(1, `hsla(${190 + i * 2.4},95%,65%,.95)`);
    ctx.fillStyle = g;
    ctx.fillRect(i * bw + 1, sh - bh, bw - 2, bh);
  }
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5; ctx.beginPath();
  const step = Math.max(1, Math.floor(A.time.length / w));
  for (let x = 0, i = 0; x < w && i < A.time.length; x++, i += step) {
    const y = sh / 2 - A.time[i] * sh * 0.45;
    x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  const lv = clamp((A.db + 90) / 90, 0, 1), pk = clamp((A.peak + 90) / 90, 0, 1);
  const mg = ctx.createLinearGradient(0, 0, w, 0);
  mg.addColorStop(0, '#22d3ee'); mg.addColorStop(.7, '#a3e635'); mg.addColorStop(.9, '#fbbf24'); mg.addColorStop(1, '#ef4444');
  ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(0, h - 12, w, 10);
  ctx.fillStyle = mg; ctx.fillRect(0, h - 12, w * lv, 10);
  ctx.fillStyle = '#fff'; ctx.fillRect(w * pk - 1, h - 14, 2, 14);

  let best = -1, bestV = -75;
  for (let b = Math.floor(60 / hzPerBin); b < Math.min(bins - 1, 5000 / hzPerBin); b++) {
    if (A.freq[b] > bestV && A.freq[b] >= A.freq[b - 1] && A.freq[b] >= A.freq[b + 1]) { bestV = A.freq[b]; best = b; }
  }
  if (best > 0) {
    const a = A.freq[best - 1], b = A.freq[best], c = A.freq[best + 1], d = a - 2 * b + c;
    A.f = (best + (d ? 0.5 * (a - c) / d : 0)) * hzPerBin;
  } else A.f = null;
  if (!txt) return;
  put(micV, 'Level', A.db.toFixed(1) + ' dB'); put(micV, 'Peak', A.peak.toFixed(1) + ' dB');
  put(micV, 'Pitch', A.f ? A.f.toFixed(1) + ' Hz' : '–'); put(micV, 'Note', A.f ? noteName(A.f) : '–');
  put(micV, 'Sample rate', (sr / 1000).toFixed(1) + ' kHz');
}

// ---------- camera ----------
const video = $('video');
const V = { stream: null, facing: 'environment', r: 0, g: 0, b: 0, l: 0, hist: new Float32Array(32), frame: 0 };
const camV = vals('camVals', ['Light', 'Color', 'Resolution', 'Frame rate', 'Camera']);
const samp = document.createElement('canvas');
samp.width = 64; samp.height = 48;
const sctx = samp.getContext('2d', { willReadFrequently: true });

async function startCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status('c-cam', 'err', 'Not supported'); return; }
  status('c-cam', 'wait', 'Requesting…');
  try {
    V.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: V.facing }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    video.srcObject = V.stream;
    video.classList.toggle('mirror', V.facing === 'user');
    await video.play();
    status('c-cam', 'live', V.facing === 'user' ? 'Front camera' : 'Back camera');
    setBtn('cam', true);
    $('flip').disabled = false;
  } catch (e) {
    V.stream = null;
    status('c-cam', 'err', e.name === 'NotAllowedError' ? 'Permission denied' : (e.message || 'Error'));
  }
}

function stopCam(quiet) {
  if (V.stream) V.stream.getTracks().forEach(t => t.stop());
  V.stream = null; video.srcObject = null;
  if (quiet) return;
  status('c-cam', 'idle', 'Stopped');
  setBtn('cam', false);
  $('flip').disabled = true;
}

$('flip').addEventListener('click', () => {
  V.facing = V.facing === 'user' ? 'environment' : 'user';
  if (V.stream) { stopCam(true); startCam(); }
});

function analyzeCam() {
  if (!V.stream || video.readyState < 2) return false;
  sctx.drawImage(video, 0, 0, 64, 48);
  const d = sctx.getImageData(0, 0, 64, 48).data;
  let r = 0, g = 0, b = 0, l = 0;
  V.hist.fill(0);
  for (let i = 0; i < d.length; i += 4) {
    const y = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    r += d[i]; g += d[i + 1]; b += d[i + 2]; l += y;
    V.hist[Math.min(31, y >> 3)]++;
  }
  const n = d.length / 4;
  V.r = r / n; V.g = g / n; V.b = b / n; V.l = l / n / 255;
  return true;
}

function drawCam(t, txt) {
  const { ctx, w, h } = fit($('camCanvas'));
  if (!V.stream) {
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, 'rgba(34,211,238,.12)'); g.addColorStop(1, 'rgba(244,114,182,.12)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    const s = 22 + 4 * Math.sin(t / 400);
    ctx.beginPath(); ctx.arc(w / 2, h / 2, s, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(w / 2, h / 2, s + 14, 0, TAU); ctx.stroke();
    return;
  }
  if (V.frame++ % 2 === 0 && !analyzeCam()) return;
  const hh = h * 0.28, bw = w / 32;
  let m = 1;
  for (const v of V.hist) m = Math.max(m, v);
  const g = ctx.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, 'rgba(34,211,238,.25)'); g.addColorStop(1, 'rgba(255,255,255,.85)');
  ctx.fillStyle = g;
  for (let i = 0; i < 32; i++) { const bh = V.hist[i] / m * hh; ctx.fillRect(i * bw, h - bh, bw - 1, bh); }
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(w / 2 - 14, h / 2); ctx.lineTo(w / 2 + 14, h / 2);
  ctx.moveTo(w / 2, h / 2 - 14); ctx.lineTo(w / 2, h / 2 + 14); ctx.stroke();
  const hex = '#' + [V.r, V.g, V.b].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  $('swatch').style.background = hex;
  if (!txt) return;
  const s = V.stream.getVideoTracks()[0].getSettings();
  put(camV, 'Light', Math.round(V.l * 100) + ' %'); put(camV, 'Color', hex);
  put(camV, 'Resolution', video.videoWidth + '×' + video.videoHeight);
  put(camV, 'Frame rate', s.frameRate ? Math.round(s.frameRate) + ' fps' : '–');
  put(camV, 'Camera', V.facing === 'user' ? 'Front' : 'Back');
}

// ---------- location ----------
const G = { id: null, pts: [], last: null, n: 0 };
const geoV = vals('geoVals', ['Latitude', 'Longitude', 'Accuracy', 'Altitude', 'Alt. ±', 'Speed', 'Course', 'Fixes']);

function startGeo() {
  if (!navigator.geolocation) { status('c-geo', 'err', 'Not supported'); return; }
  status('c-geo', 'wait', 'Locating…');
  setBtn('geo', true);
  G.id = navigator.geolocation.watchPosition(p => {
    G.last = p; G.n++;
    G.pts.push([p.coords.latitude, p.coords.longitude]);
    if (G.pts.length > 3000) G.pts.shift();
    status('c-geo', 'live', '±' + Math.round(p.coords.accuracy) + ' m');
  }, e => {
    status('c-geo', 'err', e.code === 1 ? 'Permission denied' : (e.message || 'Error'));
    if (e.code === 1) stopGeo(true);
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}

function stopGeo(keepStatus) {
  if (G.id != null) navigator.geolocation.clearWatch(G.id);
  G.id = null;
  if (!keepStatus) status('c-geo', 'idle', 'Stopped');
  setBtn('geo', false);
}

function drawGeo(t, txt) {
  const { ctx, w, h } = fit($('geoCanvas'));
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 12;
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1;
  for (const f of [1, 2 / 3, 1 / 3]) { ctx.beginPath(); ctx.arc(cx, cy, R * f, 0, TAU); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
  if (!G.last) {
    const a = (t / 1400 * TAU) % TAU;
    for (let i = 0; i < 24; i++) {
      ctx.fillStyle = `rgba(34,211,238,${0.22 * (1 - i / 24)})`;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a - (i + 1) * 0.04, a - i * 0.04); ctx.closePath(); ctx.fill();
    }
    return;
  }
  const c = G.last.coords, lat0 = c.latitude, lon0 = c.longitude, k = Math.cos(lat0 * Math.PI / 180);
  const xy = ([la, lo]) => [(lo - lon0) * 111320 * k, (la - lat0) * 110540];
  let ext = Math.max(20, c.accuracy * 1.15);
  for (const p of G.pts) { const [x, y] = xy(p); ext = Math.max(ext, Math.hypot(x, y) * 1.1); }
  const s = R / ext;
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '10px ui-monospace, Menlo, monospace';
  ctx.fillText(Math.round(ext) + ' m', cx + 4, cy - R + 12);
  ctx.fillStyle = 'rgba(34,211,238,.10)'; ctx.strokeStyle = 'rgba(34,211,238,.45)';
  ctx.beginPath(); ctx.arc(cx, cy, c.accuracy * s, 0, TAU); ctx.fill(); ctx.stroke();
  if (G.pts.length > 1) {
    const gr = ctx.createLinearGradient(0, 0, w, h);
    gr.addColorStop(0, '#22d3ee'); gr.addColorStop(1, '#f472b6');
    ctx.strokeStyle = gr; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.beginPath();
    G.pts.forEach((p, i) => { const [x, y] = xy(p); i ? ctx.lineTo(cx + x * s, cy - y * s) : ctx.moveTo(cx + x * s, cy - y * s); });
    ctx.stroke();
  }
  const pu = (t % 1600) / 1600;
  ctx.strokeStyle = `rgba(244,114,182,${1 - pu})`; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, 6 + 22 * pu, 0, TAU); ctx.stroke();
  ctx.fillStyle = '#f472b6'; ctx.shadowColor = '#f472b6'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(cx, cy, 6, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
  if (!txt) return;
  put(geoV, 'Latitude', c.latitude.toFixed(6) + '°'); put(geoV, 'Longitude', c.longitude.toFixed(6) + '°');
  put(geoV, 'Accuracy', '±' + Math.round(c.accuracy) + ' m');
  put(geoV, 'Altitude', c.altitude != null ? c.altitude.toFixed(1) + ' m' : '–');
  put(geoV, 'Alt. ±', c.altitudeAccuracy != null ? Math.round(c.altitudeAccuracy) + ' m' : '–');
  put(geoV, 'Speed', c.speed != null && c.speed >= 0 ? (c.speed * 3.6).toFixed(1) + ' km/h' : '–');
  put(geoV, 'Course', c.heading != null && !isNaN(c.heading) && c.heading >= 0 ? Math.round(c.heading) + '°' : '–');
  put(geoV, 'Fixes', String(G.n));
}

// ---------- display & device ----------
const dispV = vals('dispVals', ['Screen', 'Viewport', 'Pixel ratio', 'Orientation', 'Refresh', 'Mode', 'Online',
                                'Theme', 'Language', 'Time zone', 'CPU cores', 'Touch pts']);
let fps = 0;
function updateDisplay() {
  const o = screen.orientation;
  const ori = o ? o.type.replace('-primary', '').replace('-secondary', ' 2') + ' ' + o.angle + '°'
                : (matchMedia('(orientation: portrait)').matches ? 'portrait' : 'landscape');
  put(dispV, 'Screen', screen.width + '×' + screen.height);
  put(dispV, 'Viewport', innerWidth + '×' + innerHeight);
  put(dispV, 'Pixel ratio', (window.devicePixelRatio || 1) + '×');
  put(dispV, 'Orientation', ori);
  put(dispV, 'Refresh', fps + ' fps');
  put(dispV, 'Mode', navigator.standalone === true || matchMedia('(display-mode: standalone)').matches ? 'Home Screen' : 'Browser');
  put(dispV, 'Online', navigator.onLine ? 'yes' : 'no');
  put(dispV, 'Theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  put(dispV, 'Language', navigator.language || '–');
  put(dispV, 'Time zone', Intl.DateTimeFormat().resolvedOptions().timeZone || '–');
  put(dispV, 'CPU cores', String(navigator.hardwareConcurrency || '–'));
  put(dispV, 'Touch pts', String(navigator.maxTouchPoints || 0));
}
status('c-disp', 'live', 'Live');

// ---------- Web API support ----------
const APIS = [
  ['Motion', () => 'DeviceMotionEvent' in window],
  ['Orientation', () => 'DeviceOrientationEvent' in window],
  ['Compass', () => 'ondeviceorientationabsolute' in window || (window.DeviceOrientationEvent && 'webkitCompassHeading' in DeviceOrientationEvent.prototype)],
  ['Geolocation', () => 'geolocation' in navigator],
  ['Camera / mic', () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)],
  ['Web Audio', () => !!(window.AudioContext || window.webkitAudioContext)],
  ['Multi-touch', () => navigator.maxTouchPoints > 1],
  ['Speech input', () => 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window],
  ['Wake Lock', () => 'wakeLock' in navigator],
  ['Vibration', () => 'vibrate' in navigator],
  ['Battery', () => 'getBattery' in navigator],
  ['Ambient light', () => 'AmbientLightSensor' in window],
  ['Accelerometer API', () => 'Accelerometer' in window],
  ['Gyroscope API', () => 'Gyroscope' in window],
  ['Magnetometer API', () => 'Magnetometer' in window],
  ['Network info', () => 'connection' in navigator],
  ['Bluetooth', () => 'bluetooth' in navigator],
  ['NFC', () => 'NDEFReader' in window],
  ['USB', () => 'usb' in navigator]
];
let apiOk = 0;
for (const [name, test] of APIS) {
  let ok = false;
  try { ok = !!test(); } catch (e) {}
  if (ok) apiOk++;
  const c = document.createElement('span');
  c.className = 'chip' + (ok ? ' ok' : '');
  c.textContent = (ok ? '✓ ' : '✕ ') + name;
  $('apiChips').append(c);
}
status('c-api', 'live', apiOk + ' of ' + APIS.length + ' available');

if (!('DeviceMotionEvent' in window)) motionCards.forEach(c => status(c, 'err', 'Not supported'));

// ---------- buttons ----------
document.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.start;
  if (k === 'motion') startMotion();
  else if (k === 'mic') A.an ? stopMic() : startMic();
  else if (k === 'cam') V.stream ? stopCam() : startCam();
  else if (k === 'geo') G.id != null ? stopGeo() : startGeo();
}));

// ---------- main loop ----------
let frames = 0, fpsT = performance.now(), txtT = 0;
function loop(t) {
  frames++;
  if (t - fpsT >= 1000) {
    fps = Math.round(frames * 1000 / (t - fpsT)); frames = 0; fpsT = t;
    M.hz = M.n; M.n = 0; O.hz = O.n; O.n = 0;
    if (M.got) status('c-motion', 'live', M.hz + ' Hz');
    if (O.got) status('c-level', 'live', O.hz + ' Hz');
    updateDisplay();
  }
  const txt = t - txtT > 90;
  if (txt) txtT = t;
  if (visible.has('c-motion')) drawMotion(t, txt);
  if (visible.has('c-level')) drawLevel(t, txt);
  if (visible.has('c-compass')) drawCompass(t, txt);
  if (visible.has('c-touch')) drawTouch(t, txt);
  if (visible.has('c-mic')) drawMic(t, txt);
  if (visible.has('c-cam')) drawCam(t, txt);
  if (visible.has('c-geo')) drawGeo(t, txt);
  requestAnimationFrame(loop);
}
updateDisplay();
requestAnimationFrame(loop);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
